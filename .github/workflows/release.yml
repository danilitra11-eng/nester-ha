# When the version in manifest.json changes on main, create a GitHub Release
# (and its tag). Every Home Assistant with Nestor then shows "Update available"
# in Settings > Updates.
name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/nestor/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read the version
        id: v
        run: |
          echo "version=$(python3 -c "import json;print(json.load(open('custom_components/nestor/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Skip if this version was already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Nestor ${{ steps.v.outputs.version }}
          generate_release_notes: true
