# Push a tag like v0.3.0 -> GitHub creates a Release -> every Home Assistant
# with Nestor shows "Update available" in Settings > Updates.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/nestor/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then echo "Tag $tag != manifest $manifest"; exit 1; fi
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Nestor ${{ github.ref_name }}
          generate_release_notes: true
