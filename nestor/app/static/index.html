<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nestor</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --line:#262d36; --text:#e6edf3; --muted:#8b949e;
          --me:#1f6feb; --accent:#d4a84b; --err:#f85149; --ok:#3fb950; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
               font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  body { display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; }
  button { font: inherit; }
  header { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--line); }
  .orb { width:36px; height:36px; border-radius:50%; flex:none;
         background: radial-gradient(circle at 35% 35%, #ffe7a8, var(--accent) 45%, #6b4f12);
         box-shadow: 0 0 18px #d4a84b55; transition: transform .3s; }
  .orb.busy { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); box-shadow: 0 0 28px #d4a84baa; } }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  #status { font-size: 13px; color: var(--muted); }
  #status.bad { color: var(--err); }
  header .sp { flex:1; }
  .hbtn { background:none; border:1px solid var(--line); color:var(--muted);
          border-radius:8px; padding:6px 10px; cursor:pointer; font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width: 85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .me { align-self:flex-end; background:var(--me); color:#fff; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .act { font-size:12px; color:var(--muted); margin-top:6px; }
  form#f { display:flex; gap:8px; padding:12px 16px 20px; border-top:1px solid var(--line); }
  input[type=text], input[type=password] { flex:1; min-width:0; background:var(--panel); color:var(--text);
          border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:16px; width:100%; }
  .primary { border:0; border-radius:12px; padding:12px 18px; cursor:pointer;
             background:var(--accent); color:#1a1405; font-weight:600; }
  .primary:disabled { opacity:.5; cursor:default; }
  .ghost { background:none; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px 18px; cursor:pointer; }
  #mic { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:0 14px; cursor:pointer; }
  #mic.on { background:var(--err); color:#fff; }

  /* setup wizard */
  #wiz { position:fixed; inset:0; background:var(--bg); display:none; overflow-y:auto; z-index:5; }
  #wiz.open { display:block; }
  .wbox { max-width:560px; margin:0 auto; padding:32px 20px 40px; }
  .dots { display:flex; gap:6px; margin-bottom:28px; }
  .dots i { flex:1; height:4px; border-radius:2px; background:var(--line); }
  .dots i.on { background:var(--accent); }
  .wbox h2 { font-size:26px; margin:0 0 8px; }
  .wbox p.lead { color:var(--muted); margin:0 0 22px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .chip { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:999px; padding:8px 16px; cursor:pointer; }
  .chip.sel { border-color:var(--accent); background:#d4a84b22; }
  .cards { display:grid; gap:10px; }
  .card { text-align:start; background:var(--panel); border:1px solid var(--line); color:var(--text);
          border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; gap:12px; align-items:center; }
  .card.sel { border-color:var(--accent); background:#d4a84b1a; }
  .card .ic { font-size:24px; width:32px; text-align:center; }
  .card small { display:block; color:var(--muted); }
  .grid2 { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .warn { color:#f0b429; font-size:14px; margin-top:10px; display:none; }
  .warn.show { display:block; }
  .err { color:var(--err); font-size:14px; min-height:20px; margin-top:8px; }
  .nav { display:flex; gap:10px; margin-top:26px; }
  .nav .primary { flex:1; }
  .try { width:100%; margin-top:6px; }
  .hint { color:var(--muted); font-size:14px; margin-top:18px; }
  a { color:#f3d58e; }
  @media (max-width: 420px) { .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <div class="orb" id="orb"></div>
  <div><h1 id="title">Nestor</h1><div id="status">…</div></div>
  <div class="sp"></div>
  <button class="hbtn" id="speak" type="button"></button>
  <button class="hbtn" id="new" type="button"></button>
  <button class="hbtn" id="gear" type="button" aria-label="Settings">⚙︎</button>
</header>
<div id="log"></div>
<form id="f">
  <button id="mic" type="button" aria-label="Microphone">🎤</button>
  <input id="t" type="text" autocomplete="off">
  <button type="submit" class="primary" id="send"></button>
</form>

<div id="wiz"><div class="wbox">
  <div class="dots" id="dots"></div>
  <div id="step"></div>
  <div class="err" id="werr"></div>
  <div class="nav"><button class="ghost" id="back" type="button"></button><button class="primary" id="next" type="button"></button></div>
</div></div>

    persQ:"話し方は？", pButler:"執事", pButlerD:"丁寧で落ち着いた、少しユーモアのある話し方",
    pFriendly:"フレンドリー", pFriendlyD:"気軽でカジュアル", pBrief:"簡潔", pBriefD:"要点だけ",
    langQ:"言語は？", langAuto:"自動：話しかけられた言語で答えます",
    permQ:"何を操作してよいですか？", permHint:"それ以外は閲覧のみです。あとからここで変更できます。",
    gLights:"照明", gSwitches:"スイッチ", gClimate:"空調と扇風機", gCovers:"ブラインド",
    gMedia:"テレビとメディア", gVacuum:"ロボット掃除機", gScenes:"シーンとスクリプト", gSecurity:"鍵と警報",
    secWarn:"私と話せる人なら誰でも、ドアの解錠や警報の解除ができてしまいます。",
    doneT:"準備完了！", doneText:"試してみましょう。下をタップ：", turnOn:"{d}をつけて", turnOff:"{d}を消して",
    fallbackTry:"何ができるの？", finish:"始める",
    later:"あとからいつでも頼むだけで変更できます。例：「もっとくだけて」「夜10時から朝7時は静かに」。",
    sr:"ja-JP" },
};
const LANG_NAMES = { en:"English", es:"Español", fr:"Français", de:"Deutsch", it:"Italiano",
  pt:"Português", ru:"Русский", he:"עברית", zh:"中文", ja:"日本語" };
const GROUPS = [
  { k:"gLights", ic:"💡", d:["light"] },
  { k:"gSwitches", ic:"🔌", d:["switch", "input_boolean"] },
  { k:"gClimate", ic:"❄️", d:["climate", "fan", "humidifier", "water_heater"] },
  { k:"gCovers", ic:"🪟", d:["cover"] },
  { k:"gMedia", ic:"📺", d:["media_player"] },
  { k:"gVacuum", ic:"🧹", d:["vacuum"] },
  { k:"gScenes", ic:"✨", d:["scene", "script"] },
];

const $ = (id) => document.getElementById(id);
const BROWSER = (navigator.language || "en").toLowerCase().split("-")[0];
let S = null;            // settings from the add-on
let T = STR.en, LANG = "en";
let cid = Math.random().toString(36).slice(2);

function applyLang() {
  LANG = STR[S.language] ? S.language : (STR[BROWSER] ? BROWSER : "en");
  T = STR[LANG];
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
  $("title").textContent = S.assistant_name; document.title = S.assistant_name;
  $("t").placeholder = T.ph; $("send").textContent = T.send; $("new").textContent = T.newc;
  $("speak").textContent = S.speak_replies ? T.speakOn : T.speakOff;
  if (rec) rec.lang = T.sr;
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
  return r.json();
}
async function saveSettings(changes) {
  const r = await api("api/settings", changes);
  if (r.ok) { S = r.settings; applyLang(); }
  return r;
}

/* ---------- chat ---------- */
function add(text, who, actions) {
  const d = document.createElement("div");
  d.className = "msg " + who; d.textContent = text;
  if (actions && actions.length) {
    const a = document.createElement("div"); a.className = "act";
    a.textContent = actions.map(x => (x.ok ? "✓ " : "✗ ") + x.call.domain + "." + x.call.service +
      " → " + (x.call.entity_ids || []).join(", ")).join("\n");
    d.appendChild(a);
  }
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
function say(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text); u.lang = T.sr;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
async function status() {
  try {
    const r = await api("api/status?lang=" + LANG);
    if (r.ok) { $("status").textContent = T.ok + r.plan + T.left + r.quota_remaining; $("status").className = ""; }
    else { $("status").textContent = r.message; $("status").className = "bad"; }
  } catch (e) { $("status").textContent = "—"; }
}
async function send(text) {
  add(text, "me"); $("orb").classList.add("busy"); $("send").disabled = true;
  try {
    const data = await api("api/chat", { text, conversation_id: cid, ui_language: navigator.language || LANG });
    add(data.reply, "bot", data.actions);
    if (data.speak) say(data.reply);
    if (data.settings_changed) { S = await api("api/settings"); applyLang(); }
    if (data.quota_remaining != null) status();
  } catch (e) { add("⚠️", "bot"); }
  $("orb").classList.remove("busy"); $("send").disabled = false;
}
$("f").addEventListener("submit", (e) => {
  e.preventDefault(); const v = $("t").value.trim(); if (!v) return; $("t").value = ""; send(v);
});
$("new").onclick = () => {
  api("api/reset", { conversation_id: cid });
  cid = Math.random().toString(36).slice(2); $("log").innerHTML = "";
  add(T.hello.replace("{name}", S.assistant_name), "bot");
};
$("speak").onclick = () => saveSettings({ speak_replies: !S.speak_replies });
$("gear").onclick = () => openWizard(true);

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
if (!SR) $("mic").style.display = "none";
else {
  rec = new SR(); rec.interimResults = false;
  rec.onresult = (e) => { const v = e.results[0][0].transcript; if (v) send(v); };
  rec.onend = () => $("mic").classList.remove("on");
  $("mic").onclick = () => { $("mic").classList.add("on"); try { rec.start(); } catch (e) {} };
}

/* ---------- setup wizard ---------- */
const STEPS = ["key", "name", "personality", "language", "permissions", "done"];
let step = 0, draft = {}, editing = false, suggestion = null;

function openWizard(isEdit) {
  editing = isEdit;
  draft = { assistant_name: S.assistant_name, personality: S.personality, language: S.language,
            allowed_domains: [...S.allowed_domains], allow_security_devices: S.allow_security_devices };
  step = 0; $("wiz").classList.add("open"); render();
}
function chip(label, selected, onclick) {
  const b = document.createElement("button"); b.type = "button";
  b.className = "chip" + (selected ? " sel" : ""); b.textContent = label; b.onclick = onclick; return b;
}
function card(icon, title, sub, selected, onclick) {
  const b = document.createElement("button"); b.type = "button"; b.className = "card" + (selected ? " sel" : "");
  b.innerHTML = '<span class="ic"></span><span><b></b><small></small></span>';
  b.querySelector(".ic").textContent = icon; b.querySelector("b").textContent = title;
  b.querySelector("small").textContent = sub || ""; b.onclick = onclick; return b;
}
function h(tag, text, cls) { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; }

function render() {
  const box = $("step"); box.innerHTML = ""; $("werr").textContent = "";
  $("dots").innerHTML = STEPS.map((_, i) => `<i class="${i <= step ? "on" : ""}"></i>`).join("");
  $("back").textContent = T.back; $("back").style.visibility = step === 0 && !editing ? "hidden" : "visible";
  $("next").textContent = STEPS[step] === "done" ? T.finish : T.cont; $("next").disabled = false;
  const name = STEPS[step];

  if (name === "key") {
    box.append(h("h2", T.welcome), h("p", S.has_license_key ? T.keyKeep : T.keyText, "lead"));
    const inp = document.createElement("input"); inp.type = "password"; inp.id = "wkey";
    inp.placeholder = "XXXX-XXXX-XXXX"; inp.autocomplete = "off"; box.append(inp);
    if (!S.has_license_key) {
      const a = document.createElement("a"); a.href = TRIAL_URL; a.target = "_blank"; a.rel = "noopener";
      a.textContent = T.trial; const p = h("p", "", "hint"); p.append(a); box.append(p);
    }
  }
  if (name === "name") {
    box.append(h("h2", T.nameQ), h("p", T.nameHint, "lead"));
    const chips = h("div", "", "chips");
    ["Nestor", "Jarvis", "Alfred", "Max", "Ava"].forEach(n =>
      chips.append(chip(n, draft.assistant_name === n, () => { draft.assistant_name = n; render(); })));
    const inp = document.createElement("input"); inp.type = "text"; inp.maxLength = 40;
    inp.value = draft.assistant_name; inp.oninput = () => { draft.assistant_name = inp.value; };
    box.append(chips, inp);
  }
  if (name === "personality") {
    box.append(h("h2", T.persQ));
    const c = h("div", "", "cards");
    [["butler", "🎩", T.pButler, T.pButlerD], ["friendly", "😊", T.pFriendly, T.pFriendlyD],
     ["brief", "⚡", T.pBrief, T.pBriefD]].forEach(([k, ic, t, d]) =>
      c.append(card(ic, t, d, draft.personality === k, () => { draft.personality = k; render(); })));
    box.append(c);
  }
  if (name === "language") {
    box.append(h("h2", T.langQ));
    const c = h("div", "", "cards");
    c.append(card("🌍", T.langAuto, "", draft.language === "auto", () => { draft.language = "auto"; render(); }));
    const chips = h("div", "", "chips"); chips.style.marginTop = "12px";
    Object.entries(LANG_NAMES).forEach(([k, n]) =>
      chips.append(chip(n, draft.language === k, () => { draft.language = k; render(); })));
    box.append(c, chips);
  }
  if (name === "permissions") {
    box.append(h("h2", T.permQ), h("p", T.permHint, "lead"));
    const g = h("div", "", "grid2");
    GROUPS.forEach(grp => {
      const on = grp.d.every(d => draft.allowed_domains.includes(d));
      g.append(card(grp.ic, T[grp.k], "", on, () => {
        draft.allowed_domains = draft.allowed_domains.filter(d => !grp.d.includes(d));
        if (!on) draft.allowed_domains.push(...grp.d);
        render();
      }));
    });
    g.append(card("🔒", T.gSecurity, "", draft.allow_security_devices,
      () => { draft.allow_security_devices = !draft.allow_security_devices; render(); }));
    const w = h("div", "⚠️ " + T.secWarn, "warn" + (draft.allow_security_devices ? " show" : ""));
    box.append(g, w);
  }
  if (name === "done") {
    box.append(h("h2", T.doneT), h("p", T.doneText, "lead"));
    const cmd = suggestion && suggestion.name
      ? (suggestion.state === "on" ? T.turnOff : T.turnOn).replace("{d}", suggestion.name)
      : T.fallbackTry;
    const b = card("👉", "“" + cmd + "”", "", true, () => finish(cmd)); b.classList.add("try");
    box.append(b, h("p", T.later, "hint"));
  }
}

$("back").onclick = () => {
  if (step === 0) { $("wiz").classList.remove("open"); return; }
  step--; render();
};
$("next").onclick = async () => {
  const name = STEPS[step];
  if (name === "key") {
    const key = $("wkey").value.trim();
    if (!key && !S.has_license_key) { $("werr").textContent = T.keyText; return; }
    if (key) {
      $("next").disabled = true; $("next").textContent = T.checking;
      const r = await api("api/setup/license", { license_key: key });
      if (!r.ok) { $("werr").textContent = r.message; $("next").disabled = false; $("next").textContent = T.cont; return; }
      S.has_license_key = true;
    }
  }
  if (name === "name" && !draft.assistant_name.trim()) return;
  if (name === "language") { S.language = draft.language; applyLang(); }
  if (name === "permissions") {
    const r = await saveSettings({ ...draft, onboarded: true });
    if (!r.ok) { $("werr").textContent = r.message; return; }
    try { suggestion = await api("api/setup/suggestion"); } catch (e) { suggestion = null; }
  }
  if (name === "done") { finish(null); return; }
  step++; render();
};
function finish(cmd) {
  $("wiz").classList.remove("open");
  $("log").innerHTML = ""; add(T.hello.replace("{name}", S.assistant_name), "bot");
  status();
  if (cmd) send(cmd);
}

/* ---------- start ---------- */
(async () => {
  S = await api("api/settings");
  applyLang();
  if (!S.onboarded) { openWizard(false); return; }
  add(T.hello.replace("{name}", S.assistant_name), "bot");
  status();
})();
</script>
</body>
</html>
